name: Methodology validation

on:
  pull_request:
  push:
    branches: [main, master, data-backfill-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [alpharank, portfolio]

    steps:
      - name: Checkout AlphaRank under test
        uses: actions/checkout@v4
        with:
          path: alpharank

      - name: Checkout Portfolio sibling
        uses: actions/checkout@v4
        with:
          repository: florianbouttier/portfolio
          ref: ${{ vars.PORTFOLIO_CI_REF || 'master' }}
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: portfolio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            alpharank/pyproject.toml
            portfolio/backend/pyproject.toml

      - name: Set up Node
        if: matrix.target == 'portfolio'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portfolio/frontend/package-lock.json

      - name: Install AlphaRank
        if: matrix.target == 'alpharank'
        working-directory: alpharank
        run: python -m pip install -e '.[dev]'

      - name: Validate AlphaRank
        if: matrix.target == 'alpharank'
        working-directory: alpharank
        run: |
          python scripts/quality/check_ruff_baseline.py
          python -m pytest -q -p no:cacheprovider
          python -m pytest -q tests/test_future_mutation_invariance.py
          python -m pytest -q tests/test_recomputable_replay.py
          python scripts/validate_markdown_links.py .

      - name: Install Portfolio backend
        if: matrix.target == 'portfolio'
        working-directory: portfolio
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e 'backend[dev]'

      - name: Validate Portfolio backend and docs
        if: matrix.target == 'portfolio'
        working-directory: portfolio
        run: |
          make test
          python ../alpharank/scripts/validate_markdown_links.py .

      - name: Build Portfolio frontend
        if: matrix.target == 'portfolio'
        working-directory: portfolio/frontend
        run: |
          npm ci
          npm run build
