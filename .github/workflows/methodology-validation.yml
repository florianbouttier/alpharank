name: Methodology validation

on:
  pull_request:
  push:
    branches: [main, master, data-backfill-fixes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  alpharank:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AlphaRank
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install AlphaRank
        run: python -m pip install -e '.[dev]'

      - name: Validate AlphaRank quality and targeted causal contracts
        run: python scripts/quality/run_ci_checks.py --group ci

  portfolio-integration:
    name: Portfolio cross-repository integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout AlphaRank helper scripts
        uses: actions/checkout@v4
        with:
          path: alpharank

      - name: Checkout Portfolio sibling
        uses: actions/checkout@v4
        with:
          repository: florianbouttier/portfolio
          ref: ${{ vars.PORTFOLIO_CI_REF || 'master' }}
          token: ${{ secrets.CROSS_REPO_TOKEN || github.token }}
          path: portfolio

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: portfolio/backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portfolio/frontend/package-lock.json

      - name: Install Portfolio backend
        working-directory: portfolio
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e 'backend[dev]'

      - name: Validate Portfolio backend and docs
        working-directory: portfolio
        run: |
          make test
          python ../alpharank/scripts/validate_markdown_links.py .

      - name: Build Portfolio frontend
        working-directory: portfolio/frontend
        run: |
          npm ci
          npm run build
